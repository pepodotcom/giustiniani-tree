// ── CONFIG ─────────────────────────────────────────────────────────────────
const D2R=Math.PI/180;
const TRUNK_H=240;
// Generous spacing so sibling names don't overlap
const LEN={0:700,1:520,2:420,3:340,4:260};
const CONE={0:156,1:88,2:76,3:62,4:50};
const TH={0:14,1:8.5,2:5,3:3,4:1.8,5:1.4};
const MINA=5*D2R, MAXA=175*D2R;
const BC={'1':'#8b4018','2':'#3d6a36','3':'#1c4a72','4':'#6a3472',
          '5':'#806010','6':'#841818','7':'#186056','8':'#4a3c18'};
const PAD=200;

// ── MUTABLE LAYOUT GLOBALS ─────────────────────────────────────────────────
let _OX=0,_OY=0,_W=0,_H=0;
const TX=x=>x+_OX, TY=y=>y+_OY;

// ── SEEDED RANDOM ──────────────────────────────────────────────────────────
let _s=20220409;
const rnd=()=>{_s=(_s*1664525+1013904223)%4294967296;return _s/4294967296;};
const srnd=()=>rnd()*2-1;

// ── TREE HELPERS ───────────────────────────────────────────────────────────
function findNode(node,id){
  if(node.id===id)return node;
  if(!node.children)return null;
  for(const c of node.children){const f=findNode(c,id);if(f)return f;}
  return null;
}
function lc(n){return(!n.children||!n.children.length)?1:n.children.reduce((s,c)=>s+lc(c),0);}

// ── PERSISTENCE ────────────────────────────────────────────────────────────
function loadAdditions(){
  try{
    const saved=JSON.parse(localStorage.getItem('giustiniani-add')||'[]');
    saved.forEach(({parentId,name,year,addedId})=>{
      const parent=findNode(ROOT,parentId);
      if(parent){
        if(!parent.children)parent.children=[];
        if(!parent.children.find(c=>c.id===addedId))
          parent.children.push({id:addedId,name,year,_added:true});
      }
    });
  }catch(e){}
}
function saveAdditions(){
  const list=[];
  function collect(node){
    if(!node.children)return;
    node.children.forEach(c=>{
      if(c._added)list.push({parentId:node.id,name:c.name,year:c.year,addedId:c.id});
      collect(c);
    });
  }
  collect(ROOT);
  localStorage.setItem('giustiniani-add',JSON.stringify(list));
}

// ── LAYOUT ─────────────────────────────────────────────────────────────────
const AN=[],AE=[];
function place(node,x,y,dir,gen,branch,aS,aE){
  node.x=x;node.y=y;node.dir=dir;node.branch=branch;node.gen=gen;
  AN.push(node);
  const ch=node.children;if(!ch||!ch.length)return;
  const cone=(CONE[gen]||50)*D2R;
  const sA=Math.max(aS,dir-cone/2),eA=Math.min(aE,dir+cone/2);
  const eff=Math.max(eA-sA,0.02);
  const tot=ch.reduce((s,c)=>s+lc(c),0);
  let a=sA;
  ch.forEach(c=>{
    const w=eff*(lc(c)/tot),cS=a,cA=a+w/2;a+=w;
    const cLen=LEN[gen]||260;
    const cx=x+Math.cos(cA)*cLen,cy=y-Math.sin(cA)*cLen;
    const br=gen===0?c.id:branch;
    c.branch=br;AE.push({p:node,c,gen,br,cA});
    place(c,cx,cy,cA,gen+1,br,cS,a);
  });
}
function runLayout(){
  _s=20220409;AN.length=0;AE.length=0;
  place(ROOT,0,0,90*D2R,0,ROOT.id,MINA,MAXA);
  ROOT.x=0;ROOT.y=TRUNK_H*0.6;ROOT.dir=90*D2R;
  let mnX=1e9,mnY=1e9,mxX=-1e9,mxY=-1e9;
  AN.forEach(n=>{
    mnX=Math.min(mnX,n.x-200);mxX=Math.max(mxX,n.x+200);
    mnY=Math.min(mnY,n.y-160);mxY=Math.max(mxY,n.y+100);
  });
  mnY=Math.min(mnY,-40);mxY=Math.max(mxY,TRUNK_H+160);
  _OX=-mnX+PAD;_OY=-mnY+PAD;
  _W=(mxX-mnX)+PAD*2;_H=(mxY-mnY)+PAD*2;
}

// ── SVG HELPERS ────────────────────────────────────────────────────────────
const NS='http://www.w3.org/2000/svg';
const art=document.getElementById('art');
function E(t,a={},txt){
  const e=document.createElementNS(NS,t);
  for(const k in a)e.setAttribute(k,a[k]);
  if(txt!=null)e.textContent=txt;
  return e;
}

// ── LEAF DRAWING ───────────────────────────────────────────────────────────
function drawLeaf(tgt,x,y,ang,sz,op){
  const g=E('g',{transform:`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(-ang*180/Math.PI).toFixed(1)})`});
  g.appendChild(E('path',{
    d:`M0,0 C${sz*.38},${-sz*.42} ${sz*.8},${-sz*.38} ${sz},0 C${sz*.8},${sz*.38} ${sz*.38},${sz*.42} 0,0 Z`,
    fill:`rgba(76,95,38,${(op*.28).toFixed(2)})`,stroke:'#687840','stroke-width':.55}));
  g.appendChild(E('line',{x1:.5,y1:0,x2:sz*.88,y2:0,stroke:'#586830','stroke-width':.4,opacity:.6}));
  [[.3,.22],[.62,.2]].forEach(([t,v])=>{
    g.appendChild(E('line',{x1:sz*t,y1:0,x2:sz*t-sz*.06,y2:-sz*v,stroke:'#586830','stroke-width':.28,opacity:.45}));
    g.appendChild(E('line',{x1:sz*t,y1:0,x2:sz*t-sz*.06,y2:sz*v,stroke:'#586830','stroke-width':.28,opacity:.45}));
  });
  tgt.appendChild(g);
}
function leafCluster(tgt,x,y,ang,n,sz,op){
  for(let i=0;i<n;i++){
    const a=ang+(i-(n-1)/2)*.54+srnd()*.12;
    drawLeaf(tgt,x+srnd()*5,y+srnd()*5,a,sz*(0.85+rnd()*.3),op);
  }
}

// ── BRANCH STATE ───────────────────────────────────────────────────────────
const BGS={};           // branch group elements
const connPaths={};     // gen0→gen1 edge paths (in separate connLayer, outside branch groups)
const connHi={};        // highlight paths for the same
const branchOffsets={};  // {id: {dx,dy}} world-space offsets
let branchDrag=null;    // {id,startX,startY,origDx,origDy}
let _crownX=0,_crownY=0;

function updateConnPath(id){
  const branch=ROOT.children.find(c=>c.id===id);
  if(!branch||!connPaths[id])return;
  const {dx=0,dy=0}=branchOffsets[id]||{};
  const x1=_crownX,y1=_crownY;
  const x2=TX(branch.x)+dx,y2=TY(branch.y)+dy;
  const ddx=x2-x1,ddy=y2-y1;
  const d=`M${x1},${y1} C${x1+ddx*.32},${y1+ddy*.32} ${x1+ddx*.68},${y1+ddy*.68} ${x2},${y2}`;
  connPaths[id].setAttribute('d',d);
  connHi[id].setAttribute('d',d);
}

// ── BUILD ──────────────────────────────────────────────────────────────────
let showNames=true;
function build(){
  art.innerHTML='';
  for(const k in BGS)delete BGS[k];
  for(const k in connPaths)delete connPaths[k];
  for(const k in connHi)delete connHi[k];
  art.setAttribute('width',_W);art.setAttribute('height',_H);
  _crownX=TX(0);_crownY=TY(0);
  const cx0=TX(0),baseY=TY(TRUNK_H),crownX=_crownX,crownY=_crownY;

  // Background + defs
  const defs=E('defs');
  defs.innerHTML=`<radialGradient id="bg" cx="50%" cy="40%" r="72%">
    <stop offset="0%" stop-color="#f0e6c8"/>
    <stop offset="55%" stop-color="#e5d5ac"/>
    <stop offset="100%" stop-color="#d0bc88"/>
  </radialGradient>`;
  art.appendChild(defs);
  art.appendChild(E('rect',{x:0,y:0,width:_W,height:_H,fill:'url(#bg)'}));

  // Frame
  const fr=E('g',{fill:'none',stroke:'#8a6830','stroke-width':1.2,opacity:.66});
  fr.appendChild(E('rect',{x:22,y:22,width:_W-44,height:_H-44,rx:3}));
  fr.appendChild(E('rect',{x:30,y:30,width:_W-60,height:_H-60,rx:2,'stroke-width':.6}));
  [[28,28],[_W-28,28],[28,_H-28],[_W-28,_H-28]].forEach(([x,y])=>
    fr.appendChild(E('text',{x,y:y+5,'text-anchor':'middle',style:'font-size:14px;fill:#8a6830;stroke:none;font-family:serif;'},'❧')));
  art.appendChild(fr);

  // Ground + roots
  const gG=E('g',{opacity:.5,fill:'none'});
  gG.appendChild(E('path',{d:`M${cx0-230},${baseY+8} Q${cx0},${baseY+2} ${cx0+230},${baseY+8}`,stroke:'#5c4324','stroke-width':1.4}));
  for(let i=-210;i<=210;i+=12)
    gG.appendChild(E('line',{x1:cx0+i,y1:baseY+10,x2:cx0+i-6,y2:baseY+20,stroke:'#5c4324','stroke-width':.4,opacity:.34}));
  [-1,-.55,0,.55,1].forEach(s=>{
    const ex=cx0+s*175,ey=baseY+44+Math.abs(s)*10;
    gG.appendChild(E('path',{d:`M${cx0+s*9},${baseY} C${cx0+s*46},${baseY+16} ${ex-s*28},${ey-18} ${ex},${ey}`,
      stroke:'#5a4020','stroke-width':2.8-Math.abs(s)*1.2}));

  // Trunk
  const tw=29;

    d:`M${crownX-7},${crownY} C${crownX-13},${crownY+74} ${cx0-tw*.72},${baseY-56} ${cx0-tw},${baseY}
       L${cx0+tw},${baseY} C${cx0+tw*.72},${baseY-56} ${crownX+13},${crownY+74} ${crownX+7},${crownY} Z`,
    fill:'#7c5c2c',stroke:'#4a3418','stroke-width':1}));
  art.appendChild(E('path',{
    d:`M${crownX+2},${crownY+8} C${crownX+10},${crownY+82} ${cx0+tw*.5},${baseY-50} ${cx0+tw},${baseY}
       L${cx0+tw*.35},${baseY} C${cx0+tw*.1},${baseY-58} ${crownX},${crownY+76} ${crownX},${crownY+10} Z`,
    fill:'#5a4020',opacity:.35,stroke:'none'}));
  const bk=E('g',{stroke:'#4a3418','stroke-width':.46,fill:'none',opacity:.32});
  for(let t=1;t<10;t++){const yy=crownY+10+t*((baseY-crownY-12)/10),ww=tw*(t/10)*.85+5;
    bk.appendChild(E('path',{d:`M${cx0-ww*.7},${yy} q${ww*.7},5 ${ww*1.4},0`}));}
  art.appendChild(bk);

  // Crown foliage
  const cFol=E('g',{opacity:.7});
  leafCluster(cFol,crownX,crownY-6,90*D2R,6,14,.9);
  leafCluster(cFol,crownX-20,crownY+14,110*D2R,3,10,.7);
  leafCluster(cFol,crownX+18,crownY+14,70*D2R,3,10,.7);
  art.appendChild(cFol);

  // Connection layer (gen0→gen1 edges, SEPARATE from branch groups so drag works)
  const connLayer=E('g',{id:'conn-layer'});
  art.appendChild(connLayer);
  ROOT.children.forEach(c=>{
    const p=E('path',{fill:'none',stroke:'#6b4f28','stroke-width':TH[0],'stroke-linecap':'round'});
    const h=E('path',{fill:'none',stroke:'#9a7a44','stroke-width':TH[0]*.3,'stroke-linecap':'round',opacity:.46});
    connPaths[c.id]=p;connHi[c.id]=h;
    connLayer.appendChild(h);connLayer.appendChild(p);
    updateConnPath(c.id);
  });

  // 8 branch groups
  ROOT.children.forEach(c=>{
    const g=E('g',{id:`bg-${c.id}`});BGS[c.id]=g;art.appendChild(g);
  });

  // Edges (gen1+) into branch groups
  AE.forEach(ed=>{
    if(ed.gen===0)return; // handled by connLayer above
    const x1=TX(ed.p.x),y1=TY(ed.p.y),x2=TX(ed.c.x),y2=TY(ed.c.y);
    const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;
    const nx=-dy/L,ny=dx/L,b=srnd()*L*.09;
    const c1x=x1+dx*.3+nx*b*.6,c1y=y1+dy*.3+ny*b*.6;
    const c2x=x1+dx*.68+nx*b,c2y=y1+dy*.68+ny*b;
    const d=`M${x1},${y1} C${c1x},${c1y} ${c2x},${c2y} ${x2},${y2}`;
    const tgt=BGS[ed.br]||art;
    tgt.appendChild(E('path',{d,fill:'none',stroke:'#6b4f28','stroke-width':TH[ed.gen]||1.4,'stroke-linecap':'round'}));
    tgt.appendChild(E('path',{d,fill:'none',stroke:'#9a7a44','stroke-width':Math.max(.4,(TH[ed.gen]||1.4)*.3),'stroke-linecap':'round',opacity:.45}));
    // Decorative leaves along branches
    if(ed.gen===1){
      drawLeaf(tgt,x1+(x2-x1)*.55+srnd()*10,y1+(y2-y1)*.55+srnd()*10,ed.cA+srnd()*.4,11,.8);
      if(rnd()>.4) drawLeaf(tgt,x1+(x2-x1)*.75+srnd()*8,y1+(y2-y1)*.75+srnd()*8,ed.cA+srnd()*.5,9,.7);
    } else if(ed.gen===2&&rnd()>.45){
      drawLeaf(tgt,x1+(x2-x1)*.62+srnd()*8,y1+(y2-y1)*.62+srnd()*8,ed.cA+srnd()*.5,8,.65);
    }
  });

  // Nodes into branch groups
  AN.forEach(n=>{
    const x=TX(n.x),y=TY(n.y);
    const isCapo=n.gen===0,isFiglio=n.gen===1;
    const grp=E('g',{cursor:isFiglio?'move':'pointer'});

    // Marker
    if(isCapo){
      grp.appendChild(E('circle',{cx:x,cy:y,r:23,fill:'#2a1d0e',stroke:'#9a7634','stroke-width':2}));
      grp.appendChild(E('circle',{cx:x,cy:y,r:18,fill:'none',stroke:'#caa856','stroke-width':.8,opacity:.72}));
      grp.appendChild(E('text',{x,y:y+7,'text-anchor':'middle',style:'font-size:18px;fill:#e9dcbb;font-family:serif;'},'⚜'));
    } else if(isFiglio){
      grp.appendChild(E('circle',{cx:x,cy:y,r:11,fill:'#7a5a28',stroke:'#4a3418','stroke-width':1.4}));
      grp.appendChild(E('circle',{cx:x,cy:y,r:15,fill:'none',stroke:'#9a7634','stroke-width':.65,opacity:.58}));
      // Drag hint ring
      grp.appendChild(E('circle',{cx:x,cy:y,r:19,fill:'none',stroke:'#9a7634','stroke-width':.4,'stroke-dasharray':'3 3',opacity:.4}));
    } else {
      const r=n.gen===2?5.5:n.gen===3?4:3.2;
      const isAdded=n._added;
      grp.appendChild(E('circle',{cx:x,cy:y,r:r+2.2,fill:'none',stroke:'#7a6030','stroke-width':.5,opacity:.38}));
      grp.appendChild(E('circle',{cx:x,cy:y,r,
        fill:isAdded?'#6a8040':n.deceased?'#b0a060':'#8a6838',stroke:'#4a3418','stroke-width':.8}));
      if(n.deceased)
        grp.appendChild(E('text',{x:x+r+4,y:y-r+1,style:'font-size:9px;fill:#6a4020;font-family:serif;'},'†'));
      if(n.gen>=2&&addMode)
        grp.appendChild(E('text',{x:x+r+2,y:y-r+1,style:'font-size:11px;fill:#4a7a20;font-family:serif;cursor:pointer;'},'＋'));
      // Tip leaves
      if(!n.children||!n.children.length)
        leafCluster(BGS[n.branch]||art,x,y,n.dir,3,9,.88);
    }

    // Labels — radial for gen2+, horizontal for gen0/1
    if(showNames||isCapo||isFiglio){
      const fs=isCapo?15:isFiglio?13.5:n.gen===2?12:10.5;
      const nr=isCapo?23:isFiglio?11:n.gen===2?5.5:4;
      const lbl=E('g');
      const bs=`font-family:'IM Fell English',serif;paint-order:stroke fill;stroke:#ece0c2;fill:#2a1d0e;`;
      const ss=`font-family:'IM Fell English',serif;font-style:italic;paint-order:stroke fill;stroke:#ece0c2;fill:#6a4a20;`;
      const sw=fs>=12?'3.6px':'3px';const ssw=fs>=12?'3px':'2.6px';

      if(!isCapo){

        const yN=flip?fs-1.5:-1.5,yY=flip?-1.5:fs*.76-1;

    // Events

      if(n.spouse)html+=`<br><i>⚭ ${n.spouse}</i>`;
      if(n.children&&n.children.length)html+=`<br><span style="color:#caa856">${lc(n)} discendenti</span>`;
      if(addMode&&n.gen>=2)html+=`<br><span style="color:#8ab060;font-size:11px;">clic per aggiungere figlio</span>`;
      tip.innerHTML=html;tip.style.display='block';
    });
    grp.addEventListener('mousemove',e=>{
      const t=document.getElementById('tip');t.style.left=`${e.clientX+14}px`;t.style.top=`${e.clientY-8}px`;
    });
    grp.addEventListener('mouseleave',()=>document.getElementById('tip').style.display='none');

    // Branch drag (gen1 only)
    if(isFiglio){
      grp.addEventListener('mousedown',e=>{
        if(e.button!==0)return;
        e.stopPropagation();e.preventDefault();
        const off=branchOffsets[n.branch]||{dx:0,dy:0};
        branchDrag={id:n.branch,startX:e.clientX,startY:e.clientY,origDx:off.dx,origDy:off.dy};
      });
      grp.addEventListener('dblclick',e=>{
        e.stopPropagation();
        branchOffsets[n.branch]={dx:0,dy:0};
        BGS[n.branch].setAttribute('transform','');

    // Add mode click (gen2+)

      grp.addEventListener('click',e=>{
        if(!addMode)return;

  // Re-apply branch offsets after rebuild
  ROOT.children.forEach(c=>{
    const off=branchOffsets[c.id]||{dx:0,dy:0};
    if(off.dx||off.dy){
      BGS[c.id].setAttribute('transform',`translate(${off.dx},${off.dy})`);

  // Title
  const tg=E('g');
  tg.appendChild(E('text',{x:TX(0),y:TY(-_OY+PAD*.48),'text-anchor':'middle',
    style:'font-family:"Cinzel Decorative",serif;font-weight:700;font-size:30px;fill:#2a1d0e;letter-spacing:.06em;'},'Arbor Genealogica'));
  tg.appendChild(E('text',{x:TX(0),y:TY(-_OY+PAD*.48)+28,'text-anchor':'middle',
    style:'font-family:"Cinzel",serif;font-size:13px;fill:#6a4a20;letter-spacing:.2em;'},'· DELLA  FAMIGLIA  GIUSTINIANI ·'));
  tg.appendChild(E('text',{x:TX(0),y:TY(-_OY+PAD*.48)+46,'text-anchor':'middle',
    style:'font-family:"IM Fell English",serif;font-style:italic;font-size:12px;fill:#7a5a2c;'},'dai Giustiniani di Venezia — aggiornamento MMXXII'));
  tg.appendChild(E('text',{x:TX(0),y:TY(-_OY+PAD*.48)+58,'text-anchor':'middle',
    style:'font-family:serif;font-size:14px;fill:#9a7634;'},'❦'));
  art.appendChild(tg);

  // Capostipiti banner
  const by2=baseY+66,bw=310;
  const ban=E('g');
  ban.appendChild(E('path',{d:`M${cx0-bw/2-16},${by2} l16,-13 ${bw},0 16,13 -16,13 ${-bw},0 Z`,
    fill:'#2a1d0e',stroke:'#9a7634','stroke-width':1.4}));
  ban.appendChild(E('text',{x:cx0,y:by2,'text-anchor':'middle',
    style:'font-family:"Cinzel",serif;font-size:12.5px;letter-spacing:.12em;fill:#e9dcbb;'},'GIROLAMO GIUSTINIANI'));
  ban.appendChild(E('text',{x:cx0,y:by2+14,'text-anchor':'middle',
    style:'font-family:"IM Fell English",serif;font-style:italic;font-size:11px;fill:#caa856;'},'⚭ Giulia Pandolfini · 1899–2000'));
  art.appendChild(ban);

  // Restore slider opacities
  document.querySelectorAll('input[data-id]').forEach(sl=>{
    const g=BGS[sl.dataset.id];if(g)g.style.opacity=sl.value/100;
  });
}

// ── BRANCH PANEL ───────────────────────────────────────────────────────────
function buildPanel(){
  const pb=document.getElementById('pb');pb.innerHTML='';
  ROOT.children.forEach(c=>{
    const col=BC[c.id]||'#8a6030';
    const row=document.createElement('div');row.className='br';
    row.innerHTML=`<div class="dot" style="background:${col}"></div>
      <span class="bname">${c.id}. ${c.name}</span>
      <input type="range" min="5" max="100" value="100" data-id="${c.id}">`;
    pb.appendChild(row);
    row.querySelector('.bname').addEventListener('click',()=>isolate(c.id));
    row.querySelector('input').addEventListener('input',function(){
      const g=BGS[this.dataset.id];if(g)g.style.opacity=this.value/100;
    });
  });
  const acts=document.createElement('div');acts.className='pacts';
  acts.innerHTML=`<button class="pbtn" onclick="resetOp()">Reset</button>
    <button class="pbtn" onclick="isolate(null)">Tutti</button>`;
  pb.appendChild(acts);
}
function isolate(id){
  Object.entries(BGS).forEach(([k,g])=>{
    const op=(!id||k===id)?1:.08;g.style.opacity=op;
    const sl=document.querySelector(`input[data-id="${k}"]`);if(sl)sl.value=op*100;
  });
}
function resetOp(){Object.values(BGS).forEach(g=>g.style.opacity=1);
  document.querySelectorAll('input[data-id]').forEach(s=>s.value=100);}

// ── ADD CHILD ──────────────────────────────────────────────────────────────
let addMode=false,addTarget=null;
function toggleAddMode(){
  addMode=!addMode;
  document.getElementById('ba').classList.toggle('add-on',addMode);
  document.getElementById('hint').textContent=addMode
    ?'Modalità aggiunta: clicca un nodo (dal 2° ramo in poi) per aggiungere un figlio'
    :'Trascina · rotella per zoom · trascina un nodo gen.1 per spostare il ramo';
  build(); // rebuild to show/hide the + indicators
}
function showAddForm(node){
  addTarget=node;
  document.getElementById('add-parent-name').textContent=`Figlio di: ${node.name} ${node.sub||''} (${node.year||''})`;
  document.getElementById('add-name-inp').value='';
  document.getElementById('add-year-inp').value='';
  document.getElementById('add-err').style.display='none';
  document.getElementById('add-panel').style.display='block';
  setTimeout(()=>document.getElementById('add-name-inp').focus(),50);
}
function cancelAdd(){document.getElementById('add-panel').style.display='none';addTarget=null;}
function confirmAdd(){
  const name=document.getElementById('add-name-inp').value.trim();
  const year=document.getElementById('add-year-inp').value.trim();
  if(!name){document.getElementById('add-err').style.display='block';return;}
  if(!addTarget.children)addTarget.children=[];
  const newId=addTarget.id+'-x'+Date.now();
  addTarget.children.push({id:newId,name,year,_added:true});
  saveAdditions();
  cancelAdd();
  runLayout();build();buildPanel();
}
document.getElementById('add-name-inp').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('add-year-inp').focus();});
document.getElementById('add-year-inp').addEventListener('keydown',e=>{if(e.key==='Enter')confirmAdd();});

// ── NAMES TOGGLE ───────────────────────────────────────────────────────────
function toggleNames(){showNames=!showNames;document.getElementById('bn').classList.toggle('on',showNames);build();}

// ── PAN / ZOOM + BRANCH DRAG ───────────────────────────────────────────────
const stage=document.getElementById('stage');
let sc=1,px=0,py=0,panning=false,lx=0,ly=0,rafId=null;
function apply(){art.style.transform=`translate3d(${px}px,${py}px,0) scale(${sc})`;document.getElementById('zl').textContent=`${Math.round(sc*100)}%`;rafId=null;}
const go=()=>{if(!rafId)rafId=requestAnimationFrame(apply);};

stage.addEventListener('mousedown',e=>{
  if(e.button!==0||e.target.closest('input')||e.target.closest('#add-panel')||e.target.closest('#panel'))return;
  if(branchDrag)return; // branch drag takes priority
  panning=true;lx=e.clientX;ly=e.clientY;e.preventDefault();
});
window.addEventListener('mousemove',e=>{
  if(branchDrag){
    const wdx=(e.clientX-branchDrag.startX)/sc;
    const wdy=(e.clientY-branchDrag.startY)/sc;
    branchOffsets[branchDrag.id]={dx:branchDrag.origDx+wdx,dy:branchDrag.origDy+wdy};
    const {dx,dy}=branchOffsets[branchDrag.id];
    BGS[branchDrag.id].setAttribute('transform',`translate(${dx},${dy})`);
    updateConnPath(branchDrag.id);
    return;
  }
  if(!panning)return;
  px+=e.clientX-lx;py+=e.clientY-ly;lx=e.clientX;ly=e.clientY;go();
});
window.addEventListener('mouseup',()=>{branchDrag=null;panning=false;});

stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const d=e.deltaY<0?1.1:.909;
  const r=stage.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  px=mx-(mx-px)*d;py=my-(my-py)*d;sc=Math.max(.05,Math.min(6,sc*d));go();
},{passive:false});

let td=null;
stage.addEventListener('touchstart',e=>{
  if(e.touches.length===1){panning=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;td=Math.hypot(dx,dy);}
},{passive:true});
stage.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&panning){px+=e.touches[0].clientX-lx;py+=e.touches[0].clientY-ly;lx=e.touches[0].clientX;ly=e.touches[0].clientY;go();}
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,dd=Math.hypot(dx,dy);if(td){sc=Math.max(.05,Math.min(6,sc*(dd/td)));go();}td=dd;}
},{passive:false});
stage.addEventListener('touchend',()=>{panning=false;branchDrag=null;td=null;});

function zIn(){sc=Math.min(6,sc*1.2);go();}
function zOut(){sc=Math.max(.05,sc*.833);go();}
function fit(){const vw=stage.clientWidth,vh=stage.clientHeight-44;sc=Math.min(vw/_W,vh/_H)*.9;px=(stage.clientWidth-_W*sc)/2;py=(stage.clientHeight-_H*sc)/2;go();}

// ── GRAIN OVERLAY ─────────────────────────────────────────────────────────
(()=>{
  const gc=document.createElement('canvas');gc.width=gc.height=256;
  const gx=gc.getContext('2d'),img=gx.createImageData(256,256);
  for(let i=0;i<img.data.length;i+=4){const v=(Math.random()*36)|0;
    img.data[i]=v+38;img.data[i+1]=v+30;img.data[i+2]=v+14;img.data[i+3]=(Math.random()*14)|0;}
  gx.putImageData(img,0,0);
  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:200;';
  d.style.backgroundImage=`url(${gc.toDataURL()})`;
  d.style.backgroundSize='256px 256px';
  document.body.appendChild(d);
})();

// ── PASSWORD + INIT ────────────────────────────────────────────────────────
const PWD='giustiniani1889';
function checkPwd(){
  if(document.getElementById('gpwd').value===PWD){
    sessionStorage.setItem('auth','ok');
    const gate=document.getElementById('gate');
    gate.style.opacity='0';setTimeout(()=>gate.remove(),320);
    initTree();
  } else {
    document.getElementById('gerr').style.display='block';
    document.getElementById('gpwd').value='';
    document.getElementById('gpwd').focus();
  }
}
document.getElementById('gpwd').addEventListener('keydown',e=>{if(e.key==='Enter')checkPwd();});
function initTree(){runLayout();build();buildPanel();setTimeout(fit,80);}

// Load saved additions into data tree BEFORE layout
loadAdditions();

// Auto-auth
if(sessionStorage.getItem('auth')==='ok'){
  document.getElementById('gate').remove();
  initTree();
} else {
  setTimeout(()=>document.getElementById('gpwd').focus(),200);
}
</script>
