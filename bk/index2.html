#gerr{color:#8b2020;font-size:12px;margin-top:10px;display:none;font-style:italic;}

// ── CONFIG ─────────────────────────────────────────────────────────────────
const D2R=Math.PI/180;
const TRUNK_H=260;
// Tidy tree config: each leaf gets a guaranteed horizontal slot
const LEAF_W=140;        // minimum horizontal pixels per leaf
const LEVEL_H=240;       // vertical spacing between generations
const TH={0:14,1:8,2:4.8,3:2.8,4:1.7};
const BC={'1':'#8b4018','2':'#3d6a36','3':'#1c4a72','4':'#6a3472','5':'#806010','6':'#841818','7':'#186056','8':'#4a3c18'};
const PAD=220;
let _OX=0,_OY=0,_W=0,_H=0;
const TX=x=>x+_OX,TY=y=>y+_OY;

// ── SEEDED RANDOM ──────────────────────────────────────────────────────────
let _s=20220409;
const rnd=()=>{_s=(_s*1664525+1013904223)%4294967296;return _s/4294967296;};
const srnd=()=>rnd()*2-1;

// ── TREE HELPERS ───────────────────────────────────────────────────────────
function findNode(n,id){if(n.id===id)return n;if(!n.children)return null;for(const c of n.children){const f=findNode(c,id);if(f)return f;}return null;}
function lc(n){return(!n.children||!n.children.length)?1:n.children.reduce((s,c)=>s+lc(c),0);}
function subWidth(n){if(!n.children||!n.children.length)return LEAF_W;return n.children.reduce((s,c)=>s+subWidth(c),0);}

// ── PERSISTENCE ────────────────────────────────────────────────────────────
const LS_KEY='giusti-v2';
function loadAdditions(){
  try{
    const saved=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
    saved.forEach(({pid,name,year,aid})=>{
      const p=findNode(ROOT,pid);
      if(!p)return;
      if(!p.children)p.children=[];
      if(!p.children.find(c=>c.id===aid))
        p.children.push({id:aid,name,year,_added:true});
    });
  }catch(e){console.warn('loadAdditions error:',e);}
}
function saveAdditions(){
  const list=[];
  function col(n){
    if(!n.children)return;
    n.children.forEach(c=>{
      if(c._added)list.push({pid:n.id,name:c.name,year:c.year||'',aid:c.id});
      col(c);
    });
  }
  col(ROOT);
  localStorage.setItem(LS_KEY,JSON.stringify(list));
}

// ── LAYOUT ─────────────────────────────────────────────────────────────────
// Tidy tree (Reingold-Tilford style): each leaf gets a guaranteed horizontal slot.
// Tree grows UPWARD from trunk. ROOT (crown) at (0,0), children at y = -LEVEL_H.
const AN=[],AE=[];
function layoutTidy(node,cx,cy,gen,parent){
  node.x=cx;node.y=cy;node.gen=gen;node.parent=parent;
  if(parent){
    const dx=cx-parent.x, dy=parent.y-cy;  // dy>0 means child is above parent
    node.dir=Math.atan2(dy,dx);
  } else { node.dir=Math.PI/2; }
  AN.push(node);
  const ch=node.children;if(!ch||!ch.length)return;
  const totalW=subWidth(node);
  let cursor=cx-totalW/2;
  ch.forEach(c=>{
    const cw=subWidth(c);
    const ccx=cursor+cw/2;
    const ccy=cy-LEVEL_H;
    cursor+=cw;
    c.branch=gen===0?c.id:node.branch;
    AE.push({p:node,c,gen,br:c.branch,cA:Math.PI/2});
    layoutTidy(c,ccx,ccy,gen+1,node);
  });
}
function runLayout(){
  _s=20220409;AN.length=0;AE.length=0;
  // Layout: ROOT virtually at (0,0) = top of trunk (crown), tree grows upward
  layoutTidy(ROOT,0,0,0,null);
  // Position ROOT's visual marker on the trunk, below the crown
  ROOT.x=0;ROOT.y=TRUNK_H*0.6;ROOT.dir=Math.PI/2;
  let mnX=1e9,mnY=1e9,mxX=-1e9,mxY=-1e9;
  AN.forEach(n=>{
    mnX=Math.min(mnX,n.x-90);
    mxX=Math.max(mxX,n.x+90);
    mnY=Math.min(mnY,n.y-60);
    mxY=Math.max(mxY,n.y+70);
  });
  mxY=Math.max(mxY,TRUNK_H+200);
  _OX=-mnX+PAD;_OY=-mnY+PAD;_W=(mxX-mnX)+PAD*2;_H=(mxY-mnY)+PAD*2;
}

// ── SVG HELPERS ────────────────────────────────────────────────────────────
const NS='http://www.w3.org/2000/svg';
const art=document.getElementById('art');
function E(t,a={},txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}

// ── DRAG STATE ─────────────────────────────────────────────────────────────
// Nested subtree groups: each node's sg contains its marker + all descendants' sgs
// Incoming edge to each node is in the PARENT's sg (so it moves with parent drag)
// On node drag: move sg + update single incoming edge
const sgMap={};     // id → subtree wrapper <g>
const inEdge={};    // id → [mainPath, hiPath] — edge in PARENT's sg
const rootEdge={};  // gen1 id → [mainPath, hiPath] — ROOT→gen1 edges, in art
const bends={};     // id → lateral bend amount (preserved across drags)
const offsets={};   // id → {dx,dy} — local offset per node's sg
let drag=null;      // {id, startX, startY, origDx, origDy}
const textEls=[];   // [{el, baseFs}] — all label text elements for dynamic scaling

function bezD(x1,y1,x2,y2,b){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
  return `M${x1},${y1} C${x1+dx*.33+nx*b*.7},${y1+dy*.33+ny*b*.7} ${x1+dx*.67+nx*b},${y1+dy*.67+ny*b} ${x2},${y2}`;
}

// Recompute incoming edge for childId (edge is in parent's sg, coords are parent-sg-space)
function reEdge(id){
  const paths=inEdge[id]||rootEdge[id];if(!paths)return;
  const node=findNode(ROOT,id);if(!node||!node.parent)return;
  const isRoot=node.parent.id==='0';
  const x1=isRoot?TX(0):TX(node.parent.x);
  const y1=isRoot?TY(0):TY(node.parent.y);
  const off=offsets[id]||{dx:0,dy:0};
  const x2=TX(node.x)+off.dx,y2=TY(node.y)+off.dy;
  const d=bezD(x1,y1,x2,y2,bends[id]||0);
  paths[0].setAttribute('d',d);paths[1].setAttribute('d',d);
}
// Recompute all outgoing edges from nodeId (start point moves when node is dragged)
function reOutEdges(id){
  const node=findNode(ROOT,id);
  node?.children?.forEach(c=>{
    const paths=inEdge[c.id];if(!paths)return;
    const pOff=offsets[id]||{dx:0,dy:0};
    const cOff=offsets[c.id]||{dx:0,dy:0};
    // In id's sg-space: parent pos is fixed at (TX(node.x),TY(node.y)),
    // child pos uses child's local offset
    const x1=TX(node.x),y1=TY(node.y);
    const x2=TX(c.x)+cOff.dx,y2=TY(c.y)+cOff.dy;
    const d=bezD(x1,y1,x2,y2,bends[c.id]||0);
    paths[0].setAttribute('d',d);paths[1].setAttribute('d',d);
  });
}

// ── BOTANICAL LEAF DRAWING ─────────────────────────────────────────────────
// Leaf grows from a point ON the branch line, perpendicular to branch direction.
// This ensures every leaf is attached to its branch.
function attachedLeaf(tgt, bx, by, branchAng, side, sz, op){
  // bx,by = attachment point on branch; side = +1 left, -1 right of direction
  // petiole grows perp to branch, then leaf blade
  const perpAng = branchAng + side*Math.PI/2;
  const petioleLen = sz*0.35;
  const leafBaseX = bx + Math.cos(perpAng)*petioleLen;
  const leafBaseY = by - Math.sin(perpAng)*petioleLen;
  // Leaf direction: mostly perpendicular but slightly angled away
  const leafAng = perpAng + side*0.25;
  const g=E('g');
  // Petiole
  g.appendChild(E('line',{x1:bx,y1:by,x2:leafBaseX,y2:leafBaseY,stroke:'#5a6a2a','stroke-width':.6,opacity:op*.9}));
  // Leaf blade
  const lg=E('g',{transform:`translate(${leafBaseX.toFixed(1)},${leafBaseY.toFixed(1)}) rotate(${(-leafAng*180/Math.PI).toFixed(1)})`});
  lg.appendChild(E('path',{
    d:`M0,0 C${sz*.32},${-sz*.44} ${sz*.72},${-sz*.4} ${sz},0 C${sz*.72},${sz*.4} ${sz*.32},${sz*.44} 0,0 Z`,
    fill:`rgba(74,95,36,${(op*.24).toFixed(2)})`,stroke:'#5a7028','stroke-width':.52}));
  lg.appendChild(E('line',{x1:.5,y1:0,x2:sz*.88,y2:0,stroke:'#4a6020','stroke-width':.38,opacity:.65}));
  [[.28,.21],[.55,.18],[.78,.13]].forEach(([t,v])=>{
    const vx=sz*t;
    lg.appendChild(E('line',{x1:vx,y1:0,x2:vx-sz*.06,y2:-sz*v,stroke:'#4a6020','stroke-width':.24,opacity:.45}));
    lg.appendChild(E('line',{x1:vx,y1:0,x2:vx-sz*.06,y2:sz*v,stroke:'#4a6020','stroke-width':.24,opacity:.45}));
  });
  g.appendChild(lg);
  tgt.appendChild(g);
}

// Sample bezier at t
function bzPt(x1,y1,cx1,cy1,cx2,cy2,x2,y2,t){
  const m=1-t;
  return {
    x:m*m*m*x1+3*m*m*t*cx1+3*m*t*t*cx2+t*t*t*x2,
    y:m*m*m*y1+3*m*m*t*cy1+3*m*t*t*cy2+t*t*t*y2
  };
}
function bzTan(x1,y1,cx1,cy1,cx2,cy2,x2,y2,t){
  const m=1-t;
  return {
    dx:3*m*m*(cx1-x1)+6*m*t*(cx2-cx1)+3*t*t*(x2-cx2),
    dy:3*m*m*(cy1-y1)+6*m*t*(cy2-cy1)+3*t*t*(y2-cy2)
  };
}

// Draw branch with leaves attached at regular intervals
function drawBranchLeaves(tgt, x1,y1,x2,y2,bend,gen){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
  const cx1=x1+dx*.33+nx*bend*.7,cy1=y1+dy*.33+ny*bend*.7;
  const cx2=x1+dx*.67+nx*bend,cy2=y1+dy*.67+ny*bend;
  if(gen>2)return; // only on main branches
  const nLeaves=gen===0?4:gen===1?3:2;
  const sz=gen===0?13:gen===1?11:9;
  for(let i=0;i<nLeaves;i++){
    const t=0.25+i*(0.55/(nLeaves-1||1));
    const pt=bzPt(x1,y1,cx1,cy1,cx2,cy2,x2,y2,t);
    const tan=bzTan(x1,y1,cx1,cy1,cx2,cy2,x2,y2,t);
    const ang=Math.atan2(-tan.dy,tan.dx);
    attachedLeaf(tgt,pt.x,pt.y,ang,i%2===0?1:-1,sz*(0.85+rnd()*.3),0.88);
  }
}

// Tip leaf cluster — all growing from the node outward
function tipLeaves(tgt, x, y, dir, sz){
  const n=3;
  for(let i=0;i<n;i++){
    const spread=(i-(n-1)/2)*0.45;
    const ang=dir+spread;
    const px=x+Math.cos(ang)*4,py=y-Math.sin(ang)*4;
    attachedLeaf(tgt,x,y,ang,i%2===0?1:-1,sz*(0.8+rnd()*.35),0.85);
  }
}

// ── BUILD ──────────────────────────────────────────────────────────────────
let showNames=true;
function build(){
  art.innerHTML='';
  textEls.length=0;
  for(const k in sgMap)delete sgMap[k];
  for(const k in inEdge)delete inEdge[k];
  for(const k in rootEdge)delete rootEdge[k];
  for(const k in bends)delete bends[k];
  _s=20220409;
  art.setAttribute('width',_W);art.setAttribute('height',_H);
  const cx0=TX(0),baseY=TY(TRUNK_H),crX=TX(0),crY=TY(0);

  // Background
  const defs=E('defs');
  defs.innerHTML=`<radialGradient id="bg" cx="50%" cy="40%" r="72%">
    <stop offset="0%" stop-color="#f0e6c8"/><stop offset="55%" stop-color="#e5d5ac"/><stop offset="100%" stop-color="#d0bc88"/></radialGradient>`;
  art.appendChild(defs);
  art.appendChild(E('rect',{x:0,y:0,width:_W,height:_H,fill:'url(#bg)'}));

  // Frame
  const fr=E('g',{fill:'none',stroke:'#8a6830','stroke-width':1.2,opacity:.62});
  fr.appendChild(E('rect',{x:22,y:22,width:_W-44,height:_H-44,rx:3}));
  fr.appendChild(E('rect',{x:30,y:30,width:_W-60,height:_H-60,rx:2,'stroke-width':.6}));
  [[28,28],[_W-28,28],[28,_H-28],[_W-28,_H-28]].forEach(([x,y])=>
    fr.appendChild(E('text',{x,y:y+5,'text-anchor':'middle',style:'font-size:14px;fill:#8a6830;stroke:none;font-family:serif;'},'❧')));
  art.appendChild(fr);

  // Ground + roots
  const gG=E('g',{fill:'none',opacity:.5});
  gG.appendChild(E('path',{d:`M${cx0-250},${baseY+8} Q${cx0},${baseY+2} ${cx0+250},${baseY+8}`,stroke:'#5c4324','stroke-width':1.4}));
  for(let i=-230;i<=230;i+=12)gG.appendChild(E('line',{x1:cx0+i,y1:baseY+10,x2:cx0+i-6,y2:baseY+20,stroke:'#5c4324','stroke-width':.38,opacity:.3}));
  [-1,-.55,0,.55,1].forEach(s=>{const ex=cx0+s*185,ey=baseY+48+Math.abs(s)*10;
    gG.appendChild(E('path',{d:`M${cx0+s*9},${baseY} C${cx0+s*50},${baseY+16} ${ex-s*28},${ey-18} ${ex},${ey}`,stroke:'#5a4020','stroke-width':2.9-Math.abs(s)*1.2}));});
  art.appendChild(gG);

  // Trunk
  const tw=30;
  art.appendChild(E('path',{d:`M${crX-7},${crY} C${crX-14},${crY+78} ${cx0-tw*.72},${baseY-60} ${cx0-tw},${baseY} L${cx0+tw},${baseY} C${cx0+tw*.72},${baseY-60} ${crX+14},${crY+78} ${crX+7},${crY} Z`,fill:'#7c5c2c',stroke:'#4a3418','stroke-width':1}));
  art.appendChild(E('path',{d:`M${crX+2},${crY+8} C${crX+10},${crY+86} ${cx0+tw*.5},${baseY-54} ${cx0+tw},${baseY} L${cx0+tw*.35},${baseY} C${cx0+tw*.1},${baseY-62} ${crX},${crY+80} ${crX},${crY+10} Z`,fill:'#5a4020',opacity:.33,stroke:'none'}));
  const bk=E('g',{stroke:'#4a3418','stroke-width':.44,fill:'none',opacity:.28});
  for(let t=1;t<10;t++){const yy=crY+10+t*((baseY-crY-12)/10),ww=tw*(t/10)*.85+5;bk.appendChild(E('path',{d:`M${cx0-ww*.7},${yy} q${ww*.7},5 ${ww*1.4},0`}));}
  art.appendChild(bk);

  // ── SUBTREE BUILDER ──────────────────────────────────────────────────────
  // Builds node sg + creates its incoming edge in parentSg
  // Returns nothing; appends everything to parentSg
  function buildSg(node, parentSg){
    const sg=E('g');
    sgMap[node.id]=sg;
    const off=offsets[node.id]||{dx:0,dy:0};
    if(off.dx||off.dy)sg.setAttribute('transform',`translate(${off.dx},${off.dy})`);
    const x=TX(node.x),y=TY(node.y);
    const isCapo=node.gen===0,isFiglio=node.gen===1;

    // Incoming edge (drawn into PARENT's sg, before this sg is added)
    if(node.parent){
      const isRootEdge=node.parent.id==='0';
      const x1=isRootEdge?crX:TX(node.parent.x);
      const y1=isRootEdge?crY:TY(node.parent.y);
      const x2=TX(node.x)+off.dx,y2=TY(node.y)+off.dy;
      const L=Math.hypot(x2-x1,y2-y1)||1;
      const bend=bends[node.id]!==undefined?bends[node.id]:srnd()*L*.09;
      bends[node.id]=bend;
      const d=bezD(x1,y1,x2,y2,bend);
      const th=TH[node.gen-1]||1.7;
      const eM=E('path',{d,fill:'none',stroke:'#6b4f28','stroke-width':th,'stroke-linecap':'round'});
      const eH=E('path',{d,fill:'none',stroke:'#9a7a44','stroke-width':Math.max(.35,th*.28),'stroke-linecap':'round',opacity:.42});
      parentSg.appendChild(eH);parentSg.appendChild(eM);
      if(isRootEdge){rootEdge[node.id]=[eM,eH];}
      else{inEdge[node.id]=[eM,eH];}
      // Leaves attached to this branch
      const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),nx=-dy/len*bend,ny=dx/len*bend;
      const cx1v=x1+dx*.33+nx*.7,cy1v=y1+dy*.33+ny*.7;
      const cx2v=x1+dx*.67+nx,cy2v=y1+dy*.67+ny;
      if(node.gen<=2){
        const nL=node.gen===1?4:2;
        const sz=node.gen===1?13:10;
        for(let i=0;i<nL;i++){
          const t=0.25+i*(0.52/(nL-1||1));
          const pt=bzPt(x1,y1,cx1v,cy1v,cx2v,cy2v,x2,y2,t);
          const tan=bzTan(x1,y1,cx1v,cy1v,cx2v,cy2v,x2,y2,t);
          const ang=Math.atan2(-tan.dy,tan.dx);
          attachedLeaf(parentSg,pt.x,pt.y,ang,i%2===0?1:-1,sz*(0.85+rnd()*.3),.86);
        }
      }
    }

    // Node marker
    const mk=E('g',{cursor:'pointer'});
    if(isCapo){
      mk.appendChild(E('circle',{cx:x,cy:y,r:24,fill:'#2a1d0e',stroke:'#9a7634','stroke-width':2}));
      mk.appendChild(E('circle',{cx:x,cy:y,r:19,fill:'none',stroke:'#caa856','stroke-width':.8,opacity:.72}));
      mk.appendChild(E('text',{x,y:y+7,'text-anchor':'middle',style:'font-size:18px;fill:#e9dcbb;font-family:serif;'},'⚜'));
    } else if(isFiglio){
      mk.appendChild(E('circle',{cx:x,cy:y,r:12,fill:'#7a5a28',stroke:'#4a3418','stroke-width':1.5}));
      mk.appendChild(E('circle',{cx:x,cy:y,r:17,fill:'none',stroke:'#9a7634','stroke-width':.6,opacity:.52}));
    } else {
      const r=node.gen===2?6:node.gen===3?4.5:3.5;
      mk.appendChild(E('circle',{cx:x,cy:y,r:r+2.5,fill:'none',stroke:'#7a6030','stroke-width':.5,opacity:.34}));
      mk.appendChild(E('circle',{cx:x,cy:y,r,fill:node._added?'#5a8a30':node.deceased?'#b0a060':'#8a6838',stroke:'#4a3418','stroke-width':.8}));
      if(node.deceased)mk.appendChild(E('text',{x:x+r+4,y:y-r+1,style:'font-size:9px;fill:#6a4020;font-family:serif;'},'†'));
      // Tip leaves
      if(!node.children||!node.children.length)
        tipLeaves(sg,x,y,node.dir,9);
    }

    // ── Labels: horizontal, centered BELOW each node ───────────────────────
    // With tidy layout, each node has guaranteed horizontal space (LEAF_W),
    // so labels never overlap with siblings.
    const fs=isFiglio?14:node.gen===2?12.5:11;
    const nr=isFiglio?12:node.gen===2?6:4.5;
    if(showNames && !isCapo){
      const yOff=nr+12;  // distance from node center down to first text baseline
      const lbl=E('g');
      const tName=E('text',{x,y:y+yOff,'text-anchor':'middle','font-size':fs,
        style:`font-family:'IM Fell English',serif;paint-order:stroke fill;stroke:#ede4c6;stroke-width:3.6px;fill:#2a1d0e;`},
        node.name+(node.sub?` ${node.sub}`:''));
      lbl.appendChild(tName);
      textEls.push({el:tName,baseFs:fs,gen:node.gen});
      if(node.year){
        const yearFs=(fs*.78);
        const tYear=E('text',{x,y:y+yOff+fs*1.05,'text-anchor':'middle','font-size':yearFs.toFixed(1),
          style:`font-family:'IM Fell English',serif;font-style:italic;paint-order:stroke fill;stroke:#ede4c6;stroke-width:3px;fill:#6a4a20;`},
          node.year);
        lbl.appendChild(tYear);
        textEls.push({el:tYear,baseFs:yearFs,gen:node.gen});
      }
      sg.appendChild(lbl);
    }

    // ── Plus button: fixed offset to the right of node ──────────────────────
    if(!isCapo){
      const plusG=E('g',{class:'plus-g'});
      const plx=x+nr+16, ply=y-nr-2;
      plusG.appendChild(E('circle',{cx:plx,cy:ply,r:8,fill:'#1e3a10',stroke:'#5a8a28','stroke-width':1}));
      plusG.appendChild(E('text',{x:plx,y:ply+4,'text-anchor':'middle',style:'font-size:12px;fill:#a8d878;font-family:monospace;font-weight:bold;'},'＋'));
      plusG.addEventListener('click',e=>{e.stopPropagation();showAddForm(node);});
      sg.appendChild(plusG);
    }

    // ── Hover / drag ─────────────────────────────────────────────────────
    mk.addEventListener('mouseenter',()=>{
      if(drag)return;
      const t=document.getElementById('tip');
      let h=`<b>${node.name}${node.sub?` ${node.sub}`:''}</b> · ${node.year||'—'}`;
      if(node.spouse)h+=`<br><i>⚭ ${node.spouse}</i>`;
      if(node.children&&node.children.length)h+=`<br><span style="color:#caa856">${lc(node)} discendenti</span>`;
      t.innerHTML=h;t.style.display='block';
    });
    mk.addEventListener('mousemove',e=>{const t=document.getElementById('tip');t.style.left=`${e.clientX+14}px`;t.style.top=`${e.clientY-8}px`;});
    mk.addEventListener('mouseleave',()=>{if(!drag)document.getElementById('tip').style.display='none';});
    mk.addEventListener('mousedown',e=>{
      if(e.button!==0)return;
      e.stopPropagation();e.preventDefault();
      const o=offsets[node.id]||{dx:0,dy:0};
      drag={id:node.id,startX:e.clientX,startY:e.clientY,origDx:o.dx,origDy:o.dy};
    });
    mk.addEventListener('dblclick',e=>{
      // Double-click resets position
      e.stopPropagation();
      offsets[node.id]={dx:0,dy:0};
      sgMap[node.id].setAttribute('transform','');
      reEdge(node.id);reOutEdges(node.id);
    });
    sg.appendChild(mk);

    // Recurse — children's sgs go inside this sg
    node.children?.forEach(c=>buildSg(c,sg));
    parentSg.appendChild(sg);
  }

  // Build the full tree
  buildSg(ROOT,art);

  // Title
  const ty=PAD*0.42;
  const tg=E('g');
  tg.appendChild(E('text',{x:TX(0),y:ty+38,'text-anchor':'middle',style:'font-family:"Cinzel Decorative",serif;font-weight:700;font-size:30px;fill:#2a1d0e;letter-spacing:.06em;'},'Arbor Genealogica'));
  tg.appendChild(E('text',{x:TX(0),y:ty+62,'text-anchor':'middle',style:'font-family:"Cinzel",serif;font-size:13px;fill:#6a4a20;letter-spacing:.2em;'},'· DELLA  FAMIGLIA  GIUSTINIANI ·'));
  tg.appendChild(E('text',{x:TX(0),y:ty+80,'text-anchor':'middle',style:'font-family:"IM Fell English",serif;font-style:italic;font-size:12px;fill:#7a5a2c;'},'dai Giustiniani di Venezia — aggiornamento MMXXII'));
  tg.appendChild(E('text',{x:TX(0),y:ty+93,'text-anchor':'middle',style:'font-family:serif;font-size:14px;fill:#9a7634;'},'❦'));
  art.appendChild(tg);

  // Capostipiti banner
  const by2=baseY+68,bw=320;
  const ban=E('g');
  ban.appendChild(E('path',{d:`M${cx0-bw/2-16},${by2} l16,-13 ${bw},0 16,13 -16,13 ${-bw},0 Z`,fill:'#2a1d0e',stroke:'#9a7634','stroke-width':1.4}));
  ban.appendChild(E('text',{x:cx0,y:by2,'text-anchor':'middle',style:'font-family:"Cinzel",serif;font-size:12.5px;letter-spacing:.12em;fill:#e9dcbb;'},'GIROLAMO GIUSTINIANI'));
  ban.appendChild(E('text',{x:cx0,y:by2+14,'text-anchor':'middle',style:'font-family:"IM Fell English",serif;font-style:italic;font-size:11px;fill:#caa856;'},'⚭ Giulia Pandolfini · 1899–2000'));
  art.appendChild(ban);

  // Restore opacity sliders
  document.querySelectorAll('input[data-id]').forEach(sl=>{
    const op=sl.value/100;
    const g=sgMap[sl.dataset.id];if(g)g.style.opacity=op;
    const [em,eh]=rootEdge[sl.dataset.id]||[];if(em){em.style.opacity=op;eh.style.opacity=op;}
  });
}

// ── PANEL ─────────────────────────────────────────────────────────────────
function buildPanel(){
  const pb=document.getElementById('pb');pb.innerHTML='';
  ROOT.children.forEach(c=>{
    const col=BC[c.id]||'#8a6030';
    const row=document.createElement('div');row.className='brow';
    row.innerHTML=`<div class="bdot" style="background:${col}"></div><span class="bname">${c.id}. ${c.name}</span><input type="range" min="5" max="100" value="100" data-id="${c.id}">`;
    pb.appendChild(row);
    row.querySelector('.bname').addEventListener('click',()=>isolate(c.id));
    row.querySelector('input').addEventListener('input',function(){
      const op=this.value/100;
      const g=sgMap[this.dataset.id];if(g)g.style.opacity=op;
      const [em,eh]=rootEdge[this.dataset.id]||[];if(em){em.style.opacity=op;eh.style.opacity=op;}
    });
  });
  const acts=document.createElement('div');acts.className='pacts';
  acts.innerHTML=`<button class="pbtn" onclick="resetOp()">Reset</button><button class="pbtn" onclick="isolate(null)">Tutti</button>`;
  pb.appendChild(acts);
}
function isolate(id){
  ROOT.children.forEach(c=>{
    const op=(!id||c.id===id)?1:.08;
    const g=sgMap[c.id];if(g)g.style.opacity=op;
    const [em,eh]=rootEdge[c.id]||[];if(em){em.style.opacity=op;eh.style.opacity=op;}
    const sl=document.querySelector(`input[data-id="${c.id}"]`);if(sl)sl.value=op*100;
  });
}
function resetOp(){
  ROOT.children.forEach(c=>{
    const g=sgMap[c.id];if(g)g.style.opacity=1;
    const [em,eh]=rootEdge[c.id]||[];if(em){em.style.opacity=1;eh.style.opacity=1;}
    const sl=document.querySelector(`input[data-id="${c.id}"]`);if(sl)sl.value=100;
  });
}

// ── ADD CHILD ─────────────────────────────────────────────────────────────
let addTarget=null;
function showAddForm(node){
  addTarget=node;
  document.getElementById('add-for').textContent=`Figlio di: ${node.name}${node.sub?' '+node.sub:''} (${node.year||'?'})`;
  document.getElementById('an').value='';document.getElementById('ay').value='';
  document.getElementById('aerr').style.display='none';
  document.getElementById('add-panel').style.display='block';
  setTimeout(()=>document.getElementById('an').focus(),50);
}
function cancelAdd(){document.getElementById('add-panel').style.display='none';addTarget=null;}
function confirmAdd(){
  const name=document.getElementById('an').value.trim();
  const year=document.getElementById('ay').value.trim();
  if(!name){document.getElementById('aerr').style.display='block';return;}
  if(!addTarget.children)addTarget.children=[];
  addTarget.children.push({id:addTarget.id+'-x'+Date.now(),name,year,_added:true});
  saveAdditions();
  cancelAdd();
  runLayout();build();buildPanel();
}
document.getElementById('an').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('ay').focus();});
document.getElementById('ay').addEventListener('keydown',e=>{if(e.key==='Enter')confirmAdd();});

// ── NAMES TOGGLE ──────────────────────────────────────────────────────────
function toggleNames(){showNames=!showNames;document.getElementById('bn').classList.toggle('on',showNames);build();}

// ── PAN / ZOOM + DRAG ─────────────────────────────────────────────────────
const stage=document.getElementById('stage');
let sc=1,px=0,py=0,panning=false,lx=0,ly=0,rafId=null;
const MIN_LABEL_PX=11; // minimum screen pixels for label text

// Progressive disclosure: at very low zoom, hide deeper-gen labels to keep
// readability tidy. With tidy layout, labels never overlap horizontally,
// but at extreme zoom-out they pile up vertically — so we still progressive-show.
function genVisible(gen){
  if(sc<0.18) return gen<=1;       // only capostipiti + 8 figli
  if(sc<0.32) return gen<=2;       // + nipoti
  if(sc<0.55) return gen<=3;       // + bisnipoti
  return true;                      // full detail
}

function applyVP(){
  art.style.transform=`translate3d(${px}px,${py}px,0) scale(${sc})`;
  document.getElementById('zl').textContent=`${Math.round(sc*100)}%`;
  // Scale labels to stay ≥ MIN_LABEL_PX on screen, AND hide deeper gens at low zoom
  textEls.forEach(({el,baseFs,gen})=>{
    if(!genVisible(gen)){el.style.display='none';return;}
    el.style.display='';
    const efs=Math.max(baseFs, MIN_LABEL_PX/sc);
    el.setAttribute('font-size',efs.toFixed(1));
    const sw=(3.2/sc).toFixed(2);
    const cur=el.getAttribute('style')||'';
    el.setAttribute('style',cur.replace(/stroke-width:[^;]+/,`stroke-width:${sw}px`));
  });
  rafId=null;
}
const go=()=>{if(!rafId)rafId=requestAnimationFrame(applyVP);};

stage.addEventListener('mousedown',e=>{
  if(e.button!==0||drag)return;
  if(e.target.closest('#add-panel')||e.target.closest('#panel'))return;
  panning=true;lx=e.clientX;ly=e.clientY;e.preventDefault();
});
window.addEventListener('mousemove',e=>{
  if(drag){
    const wdx=(e.clientX-drag.startX)/sc,wdy=(e.clientY-drag.startY)/sc;
    const dx=drag.origDx+wdx,dy=drag.origDy+wdy;
    offsets[drag.id]={dx,dy};
    const sg=sgMap[drag.id];if(sg)sg.setAttribute('transform',`translate(${dx},${dy})`);
    reEdge(drag.id);
    reOutEdges(drag.id);
    // Also update ROOT→gen1 edge if applicable
    if(rootEdge[drag.id]){
      const node=findNode(ROOT,drag.id);
      const d=bezD(TX(0),TY(0),TX(node.x)+dx,TY(node.y)+dy,bends[drag.id]||0);
      rootEdge[drag.id][0].setAttribute('d',d);
      rootEdge[drag.id][1].setAttribute('d',d);
    }
    return;
  }
  if(!panning)return;
  px+=e.clientX-lx;py+=e.clientY-ly;lx=e.clientX;ly=e.clientY;go();
});
window.addEventListener('mouseup',()=>{drag=null;panning=false;});

stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const d=e.deltaY<0?1.1:.909;
  const r=stage.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  px=mx-(mx-px)*d;py=my-(my-py)*d;sc=Math.max(.05,Math.min(6,sc*d));go();
},{passive:false});
let td=null;
stage.addEventListener('touchstart',e=>{
  if(e.touches.length===1){panning=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;td=Math.hypot(dx,dy);}
},{passive:true});
stage.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&panning){px+=e.touches[0].clientX-lx;py+=e.touches[0].clientY-ly;lx=e.touches[0].clientX;ly=e.touches[0].clientY;go();}
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,dd=Math.hypot(dx,dy);if(td){sc=Math.max(.05,Math.min(6,sc*(dd/td)));go();}td=dd;}
},{passive:false});
stage.addEventListener('touchend',()=>{panning=false;drag=null;td=null;});
function zIn(){sc=Math.min(6,sc*1.2);go();}
function zOut(){sc=Math.max(.05,sc*.833);go();}
function fit(){const vw=stage.clientWidth,vh=stage.clientHeight-44;sc=Math.min(vw/_W,vh/_H)*.9;px=(stage.clientWidth-_W*sc)/2;py=(stage.clientHeight-_H*sc)/2;go();}

// ── JPEG EXPORT ───────────────────────────────────────────────────────────
function exportJPEG(){
  const btn=document.getElementById('expbtn');
  btn.textContent='…';btn.disabled=true;
  const svgEl=document.getElementById('art');

  // ── 1. Snapshot current label state, force ALL labels visible at base size ──
  const snapshot=textEls.map(t=>({
    el:t.el, baseFs:t.baseFs,
    fs:t.el.getAttribute('font-size'),
    display:t.el.style.display,
    style:t.el.getAttribute('style')
  }));
  textEls.forEach(({el,baseFs})=>{
    el.style.display='';
    el.setAttribute('font-size',baseFs);
    const cur=el.getAttribute('style')||'';
    // Use base stroke-width for clean export halo
    el.setAttribute('style',cur.replace(/stroke-width:[^;]+/,`stroke-width:${baseFs>=13?'3.6':'3'}px`));
  });

  // Inline serif font fallback (Google Fonts won't load inside canvas)
  const styleEl=document.createElement('style');
  styleEl.textContent=`text{font-family:Georgia,"Times New Roman",serif;}`;
  svgEl.insertBefore(styleEl,svgEl.firstChild);

  const svgStr=new XMLSerializer().serializeToString(svgEl);

  // Clean up
  svgEl.removeChild(styleEl);
  snapshot.forEach(s=>{
    if(s.fs!==null)s.el.setAttribute('font-size',s.fs);
    s.el.style.display=s.display;
    if(s.style!==null)s.el.setAttribute('style',s.style);
  });

  // ── 2. A3 landscape at 300 DPI = 4961 × 3508 px ──
  // (A3 = 297 × 420 mm; 420mm ÷ 25.4 × 300 = 4961px; 297mm ÷ 25.4 × 300 = 3508px)
  const treeAspect=_W/_H;
  const useLandscape=treeAspect>=1;
  const outW=useLandscape?4961:3508;
  const outH=useLandscape?3508:4961;

  const canvas=document.createElement('canvas');
  canvas.width=outW;canvas.height=outH;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#e8d8b2';ctx.fillRect(0,0,outW,outH);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';

  // Fit tree into canvas with margin, centered
  const margin=120;
  const fitScale=Math.min((outW-margin*2)/_W,(outH-margin*2)/_H);
  const drawW=_W*fitScale,drawH=_H*fitScale;
  const offX=(outW-drawW)/2,offY=(outH-drawH)/2;

  const blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    ctx.drawImage(img,offX,offY,drawW,drawH);
    URL.revokeObjectURL(url);
    canvas.toBlob(b=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download=`Giustiniani-Arbor-A3-${new Date().getFullYear()}.jpg`;
      a.click();
      btn.textContent='↓ JPEG A3';btn.disabled=false;
    },'image/jpeg',.92);
  };
  img.onerror=()=>{
    URL.revokeObjectURL(url);
    btn.textContent='↓ JPEG A3';btn.disabled=false;
    alert('Errore export — riprova.');
  };
  img.src=url;
}

// ── GRAIN ─────────────────────────────────────────────────────────────────
(()=>{const gc=document.createElement('canvas');gc.width=gc.height=256;const gx=gc.getContext('2d'),img=gx.createImageData(256,256);for(let i=0;i<img.data.length;i+=4){const v=(Math.random()*36)|0;img.data[i]=v+38;img.data[i+1]=v+30;img.data[i+2]=v+14;img.data[i+3]=(Math.random()*13)|0;}gx.putImageData(img,0,0);const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:200;';d.style.backgroundImage=`url(${gc.toDataURL()})`;d.style.backgroundSize='256px 256px';document.body.appendChild(d);})();
