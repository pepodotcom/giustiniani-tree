// ── CONFIG ─────────────────────────────────────────────────────────────────
const D2R=Math.PI/180;
const TRUNK_H=250;
// Very generous — ensures no name crowding
const LEN={0:880,1:660,2:530,3:420,4:320};
const CONE={0:156,1:88,2:76,3:62,4:50};
const TH={0:14,1:8,2:4.8,3:2.8,4:1.7,5:1.2};
const MINA=5*D2R,MAXA=175*D2R;
const BC={'1':'#8b4018','2':'#3d6a36','3':'#1c4a72','4':'#6a3472','5':'#806010','6':'#841818','7':'#186056','8':'#4a3c18'};
const PAD=240;
let _OX=0,_OY=0,_W=0,_H=0;
const TX=x=>x+_OX,TY=y=>y+_OY;

// ── SEEDED RANDOM ──────────────────────────────────────────────────────────
let _s=20220409;
const rnd=()=>{_s=(_s*1664525+1013904223)%4294967296;return _s/4294967296;};
const srnd=()=>rnd()*2-1;

// ── TREE HELPERS ───────────────────────────────────────────────────────────
function findNode(node,id){
  if(node.id===id)return node;
  if(!node.children)return null;
  for(const c of node.children){const f=findNode(c,id);if(f)return f;}
  return null;
}
function lc(n){return(!n.children||!n.children.length)?1:n.children.reduce((s,c)=>s+lc(c),0);}

// ── PERSISTENCE ────────────────────────────────────────────────────────────
function loadAdditions(){
  try{
    JSON.parse(localStorage.getItem('giusti-add')||'[]').forEach(({pid,name,year,aid})=>{
      const p=findNode(ROOT,pid);
      if(p){if(!p.children)p.children=[];
        if(!p.children.find(c=>c.id===aid))p.children.push({id:aid,name,year,_added:true});}
    });
  }catch(e){}
}
function saveAdditions(){
  const list=[];
  function col(n){if(!n.children)return;n.children.forEach(c=>{if(c._added)list.push({pid:n.id,name:c.name,year:c.year,aid:c.id});col(c);});}
  col(ROOT);localStorage.setItem('giusti-add',JSON.stringify(list));
}

// ── LAYOUT ─────────────────────────────────────────────────────────────────
const AN=[],AE=[];
function place(node,x,y,dir,gen,branch,aS,aE,parent){
  node.x=x;node.y=y;node.dir=dir;node.branch=branch;node.gen=gen;node.parent=parent;
  AN.push(node);
  const ch=node.children;if(!ch||!ch.length)return;
  const cone=(CONE[gen]||50)*D2R;
  const sA=Math.max(aS,dir-cone/2),eA=Math.min(aE,dir+cone/2);
  const eff=Math.max(eA-sA,0.02);
  const tot=ch.reduce((s,c)=>s+lc(c),0);
  let a=sA;
  ch.forEach(c=>{
    const w=eff*(lc(c)/tot),cS=a,cA=a+w/2;a+=w;
    const len=LEN[gen]||320;
    const cx=x+Math.cos(cA)*len,cy=y-Math.sin(cA)*len;
    const br=gen===0?c.id:branch;
    c.branch=br;AE.push({p:node,c,gen,br,cA});
    place(c,cx,cy,cA,gen+1,br,cS,a,node);
  });
}
function runLayout(){
  _s=20220409;AN.length=0;AE.length=0;
  place(ROOT,0,0,90*D2R,0,ROOT.id,MINA,MAXA,null);
  ROOT.x=0;ROOT.y=TRUNK_H*0.6;ROOT.dir=90*D2R;
  let mnX=1e9,mnY=1e9,mxX=-1e9,mxY=-1e9;
  AN.forEach(n=>{mnX=Math.min(mnX,n.x-210);mxX=Math.max(mxX,n.x+210);mnY=Math.min(mnY,n.y-165);mxY=Math.max(mxY,n.y+105);});
  mnY=Math.min(mnY,-45);mxY=Math.max(mxY,TRUNK_H+170);
  _OX=-mnX+PAD;_OY=-mnY+PAD;_W=(mxX-mnX)+PAD*2;_H=(mxY-mnY)+PAD*2;
}

const NS='http://www.w3.org/2000/svg';
const art=document.getElementById('art');
function E(t,a={},txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}

// ── DRAG STATE ─────────────────────────────────────────────────────────────
// Per-node offset (world coords) stored here. Subtree group translates by this amount.
const nodeOffsets={}; // {id:{dx,dy}}
const subGrps={};     // {id: SVG <g> that wraps the node + ALL its descendants}
const inEdgePaths={};  // {id: [mainPath, hiPath]} — edge incoming to this node
const edgeBends={};    // {id: number} — stored lateral bend for each edge
let nodeDrag=null;     // {id, startX, startY, origDx, origDy}

// Compute bezier path string given start/end and a lateral bend amount
function bezierD(x1,y1,x2,y2,bend){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;
  const nx=-dy/L,ny=dx/L;
  const c1x=x1+dx*.33+nx*bend*.7,c1y=y1+dy*.33+ny*bend*.7;
  const c2x=x1+dx*.67+nx*bend,c2y=y1+dy*.67+ny*bend;
  return `M${x1},${y1} C${c1x},${c1y} ${c2x},${c2y} ${x2},${y2}`;
}

// Recompute and update edge incoming to childId
// Coordinates are in the PARENT'S subtree group space = same as SVG space when root group has no transform
function reEdge(childId){
  if(!inEdgePaths[childId])return;
  const child=findNode(ROOT,childId);if(!child)return;
  const parent=child.parent;if(!parent)return;
  // Parent visual position in its own group coordinate space (= SVG abs coords + parent's OWN offset)
  // Because the parent's subGrp transform is already applied by SVG rendering,
  // edge coordinates are in the parent-group space (not accounting for parent's own offset).
  // So: start = (TX(parent.x), TY(parent.y)) BUT if parent is ROOT, use crown
  const usesCrown=parent.id==='0';
  const x1=usesCrown?TX(0):TX(parent.x);
  const y1=usesCrown?TY(0):TY(parent.y);
  // Child's position in parent-group space = TX(child.x) + child's own offset
  const cOff=nodeOffsets[childId]||{dx:0,dy:0};
  const x2=TX(child.x)+cOff.dx,y2=TY(child.y)+cOff.dy;
  const bend=edgeBends[childId]||0;
  const d=bezierD(x1,y1,x2,y2,bend);
  inEdgePaths[childId][0].setAttribute('d',d);
  inEdgePaths[childId][1].setAttribute('d',d);
}

// ── LEAF HELPERS ───────────────────────────────────────────────────────────
function drawLeaf(tgt,x,y,ang,sz,op){
  const g=E('g',{transform:`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(-ang*180/Math.PI).toFixed(1)})`});
  g.appendChild(E('path',{d:`M0,0 C${sz*.38},${-sz*.42} ${sz*.8},${-sz*.38} ${sz},0 C${sz*.8},${sz*.38} ${sz*.38},${sz*.42} 0,0 Z`,fill:`rgba(76,95,38,${(op*.28).toFixed(2)})`,stroke:'#687840','stroke-width':.54}));
  g.appendChild(E('line',{x1:.5,y1:0,x2:sz*.88,y2:0,stroke:'#586830','stroke-width':.38,opacity:.58}));
  [[.32,.22],[.62,.2]].forEach(([t,v])=>{
    g.appendChild(E('line',{x1:sz*t,y1:0,x2:sz*t-sz*.06,y2:-sz*v,stroke:'#586830','stroke-width':.26,opacity:.42}));
    g.appendChild(E('line',{x1:sz*t,y1:0,x2:sz*t-sz*.06,y2:sz*v,stroke:'#586830','stroke-width':.26,opacity:.42}));
  });
  tgt.appendChild(g);
}
function leafCluster(tgt,x,y,ang,n,sz,op){for(let i=0;i<n;i++){const a=ang+(i-(n-1)/2)*.54+srnd()*.12;drawLeaf(tgt,x+srnd()*5,y+srnd()*5,a,sz*(0.85+rnd()*.3),op);}}

// ── BUILD (nested subtree architecture) ───────────────────────────────────
let showNames=true;
// Stores the gen1 ROOT→gen1 edge elements separately (they live outside subtree groups)
const rootEdgePaths={}; // {gen1Id:[mainPath,hiPath]}

function buildSubtree(node,parentGroup){
  // Create subtree wrapper group for this node + all its descendants
  const sg=E('g');
  sg._id=node.id;
  subGrps[node.id]=sg;
  // Apply stored offset if any
  const off=nodeOffsets[node.id]||{dx:0,dy:0};
  if(off.dx||off.dy)sg.setAttribute('transform',`translate(${off.dx},${off.dy})`);

  const x=TX(node.x),y=TY(node.y);
  const isCapo=node.gen===0,isFiglio=node.gen===1;

  // Draw edge from parent to this node (placed in PARENT's group so it doesn't transform with this node)
  if(node.parent){
    const usesCrown=node.parent.id==='0';
    const x1=usesCrown?TX(0):TX(node.parent.x);
    const y1=usesCrown?TY(0):TY(node.parent.y);
    const x2=TX(node.x)+(off.dx),y2=TY(node.y)+(off.dy);
    const L=Math.hypot(x2-x1,y2-y1)||1;
    const bend=srnd()*L*.09;
    edgeBends[node.id]=bend;
    const d=bezierD(x1,y1,x2,y2,bend);
    const th=TH[node.gen-1]||1.4;
    const eMain=E('path',{d,fill:'none',stroke:'#6b4f28','stroke-width':th,'stroke-linecap':'round'});
    const eHi=E('path',{d,fill:'none',stroke:'#9a7a44','stroke-width':Math.max(.35,th*.28),'stroke-linecap':'round',opacity:.44});

    if(usesCrown){
      // ROOT→gen1 edges live outside the subtree group (so opacity slider works cleanly)
      rootEdgePaths[node.id]=[eMain,eHi];
      parentGroup.appendChild(eHi);parentGroup.appendChild(eMain);
    } else {
      inEdgePaths[node.id]=[eMain,eHi];
      parentGroup.appendChild(eHi);parentGroup.appendChild(eMain);
    }

    // Decorative leaves along branch
    if(node.gen===1){drawLeaf(sg,x1+(x2-x1)*.55+srnd()*12,y1+(y2-y1)*.55+srnd()*12,node.dir+srnd()*.4,12,.78);}
    else if(node.gen===2&&rnd()>.42){drawLeaf(sg,x1+(x2-x1)*.62+srnd()*10,y1+(y2-y1)*.62+srnd()*10,node.dir+srnd()*.5,9,.66);}
  }

  // Node marker
  const mk=E('g',{cursor:'pointer'});
  if(isCapo){
    mk.appendChild(E('circle',{cx:x,cy:y,r:24,fill:'#2a1d0e',stroke:'#9a7634','stroke-width':2}));
    mk.appendChild(E('circle',{cx:x,cy:y,r:19,fill:'none',stroke:'#caa856','stroke-width':.8,opacity:.72}));
    mk.appendChild(E('text',{x,y:y+7,'text-anchor':'middle',style:'font-size:18px;fill:#e9dcbb;font-family:serif;'},'⚜'));
  } else if(isFiglio){
    mk.appendChild(E('circle',{cx:x,cy:y,r:12,fill:'#7a5a28',stroke:'#4a3418','stroke-width':1.5}));
    mk.appendChild(E('circle',{cx:x,cy:y,r:17,fill:'none',stroke:'#9a7634','stroke-width':.6,opacity:.55}));
  } else {
    const r=node.gen===2?6:node.gen===3?4.5:3.5;
    mk.appendChild(E('circle',{cx:x,cy:y,r:r+2.5,fill:'none',stroke:'#7a6030','stroke-width':.5,opacity:.36}));
    mk.appendChild(E('circle',{cx:x,cy:y,r,fill:node._added?'#5a8a30':node.deceased?'#b0a060':'#8a6838',stroke:'#4a3418','stroke-width':.8}));
    if(node.deceased)mk.appendChild(E('text',{x:x+r+4,y:y-r+1,style:'font-size:9px;fill:#6a4020;font-family:serif;'},'†'));
    if(!node.children||!node.children.length){leafCluster(sg,x,y,node.dir,3,9,.85);}
  }

  // Labels (radial for all except capostipiti)
  if(showNames){
    const fs=isCapo?15:isFiglio?14:node.gen===2?12.5:11;
    const nr=isCapo?24:isFiglio?12:node.gen===2?6:4.5;
    const lbl=E('g');
    const bs=`font-family:'IM Fell English',serif;paint-order:stroke fill;stroke:#ede2c4;fill:#2a1d0e;`;
    const ss=`font-family:'IM Fell English',serif;font-style:italic;paint-order:stroke fill;stroke:#ede2c4;fill:#6a4a20;`;
    const sw=fs>=13?'3.8px':'3.2px',ssw=fs>=13?'3.2px':'2.8px';

    if(!isCapo){
      const ang=node.dir;let deg=(-ang*180/Math.PI);const flip=Math.cos(ang)<0;if(flip)deg+=180;
      const gap=nr+9;const yN=flip?fs-1.5:-1.5,yY=flip?-1.5:fs*.76-1;
      lbl.setAttribute('transform',`translate(${x},${y}) rotate(${deg.toFixed(2)})`);
      lbl.appendChild(E('text',{x:gap,y:yN,style:`font-size:${fs}px;stroke-width:${sw};${bs}`},
        node.name+(node.sub?` ${node.sub}`:'')));
      if(node.year)lbl.appendChild(E('text',{x:gap,y:yY,style:`font-size:${(fs*.75).toFixed(1)}px;stroke-width:${ssw};${ss}`},node.year));
    }
    sg.appendChild(lbl);
  }

  // ── "+" add button — always visible, low opacity, hover = full ──
  if(!isCapo){
    const plusG=E('g',{class:'plus-g'});
    // Position: slightly above-right of node
    const px2=x+15,py2=y-15;
    plusG.appendChild(E('circle',{cx:px2,cy:py2,r:9,fill:'#2a4a18',stroke:'#5a8030','stroke-width':1}));
    plusG.appendChild(E('text',{x:px2,y:py2+4,'text-anchor':'middle',style:'font-size:13px;fill:#c8e8a0;font-weight:bold;font-family:monospace;'},'＋'));
    plusG.addEventListener('click',e=>{e.stopPropagation();showAddForm(node);});
    sg.appendChild(plusG);
  }

  // Drag handler on marker (drag moves this subtree)
  mk.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    e.stopPropagation();e.preventDefault();
    const o=nodeOffsets[node.id]||{dx:0,dy:0};
    nodeDrag={id:node.id,startX:e.clientX,startY:e.clientY,origDx:o.dx,origDy:o.dy};
  });
  // Prevent marker click from opening add form accidentally
  mk.addEventListener('click',e=>{
    if(Math.abs(e.clientX-(nodeDrag?.startX||e.clientX))>4)return;
    e.stopPropagation();
    const tip=document.getElementById('tip');
    let html=`<b>${node.name}${node.sub?` ${node.sub}`:''}</b> · ${node.year||'—'}`;
    if(node.spouse)html+=`<br><i>⚭ ${node.spouse}</i>`;
    if(node.children&&node.children.length)html+=`<br><span style="color:#caa856">${lc(node)} discendenti</span>`;
    tip.innerHTML=html;tip.style.left=`${e.clientX+14}px`;tip.style.top=`${e.clientY-8}px`;
    tip.style.display='block';setTimeout(()=>tip.style.display='none',3500);
  });
  mk.addEventListener('mouseenter',()=>{
    if(nodeDrag)return;
    const tip=document.getElementById('tip');
    let html=`<b>${node.name}${node.sub?` ${node.sub}`:''}</b> · ${node.year||'—'}`;
    if(node.spouse)html+=`<br><i>⚭ ${node.spouse}</i>`;
    if(node.children&&node.children.length)html+=`<br><span style="color:#caa856">${lc(node)} discendenti</span>`;
    tip.innerHTML=html;tip.style.display='block';
  });
  mk.addEventListener('mousemove',e=>{const t=document.getElementById('tip');t.style.left=`${e.clientX+14}px`;t.style.top=`${e.clientY-8}px`;});
  mk.addEventListener('mouseleave',()=>{if(!nodeDrag)document.getElementById('tip').style.display='none';});

  sg.appendChild(mk);

  // Recurse into children — they go into THIS subtree group
  if(node.children){
    node.children.forEach(child=>{
      buildSubtree(child,sg);
    });
  }

  parentGroup.appendChild(sg);
}

function build(){
  art.innerHTML='';
  for(const k in subGrps)delete subGrps[k];
  for(const k in inEdgePaths)delete inEdgePaths[k];
  for(const k in rootEdgePaths)delete rootEdgePaths[k];
  for(const k in edgeBends)delete edgeBends[k];
  _s=20220409; // reset for consistent leaf/edge randomness
  art.setAttribute('width',_W);art.setAttribute('height',_H);
  const cx0=TX(0),baseY=TY(TRUNK_H),crownX=TX(0),crownY=TY(0);

  const defs=E('defs');
  defs.innerHTML=`<radialGradient id="bg" cx="50%" cy="40%" r="72%"><stop offset="0%" stop-color="#f0e6c8"/><stop offset="55%" stop-color="#e5d5ac"/><stop offset="100%" stop-color="#d0bc88"/></radialGradient>`;
  art.appendChild(defs);
  art.appendChild(E('rect',{x:0,y:0,width:_W,height:_H,fill:'url(#bg)'}));

  // Frame
  const fr=E('g',{fill:'none',stroke:'#8a6830','stroke-width':1.2,opacity:.64});
  fr.appendChild(E('rect',{x:22,y:22,width:_W-44,height:_H-44,rx:3}));
  fr.appendChild(E('rect',{x:30,y:30,width:_W-60,height:_H-60,rx:2,'stroke-width':.6}));
  [[28,28],[_W-28,28],[28,_H-28],[_W-28,_H-28]].forEach(([fx,fy])=>fr.appendChild(E('text',{x:fx,y:fy+5,'text-anchor':'middle',style:'font-size:14px;fill:#8a6830;stroke:none;font-family:serif;'},'❧')));
  art.appendChild(fr);

  // Ground + roots
  const gG=E('g',{opacity:.5,fill:'none'});
  gG.appendChild(E('path',{d:`M${cx0-240},${baseY+8} Q${cx0},${baseY+2} ${cx0+240},${baseY+8}`,stroke:'#5c4324','stroke-width':1.4}));
  for(let i=-220;i<=220;i+=12)gG.appendChild(E('line',{x1:cx0+i,y1:baseY+10,x2:cx0+i-6,y2:baseY+20,stroke:'#5c4324','stroke-width':.4,opacity:.32}));
  [-1,-.55,0,.55,1].forEach(s=>{const ex=cx0+s*180,ey=baseY+46+Math.abs(s)*10;gG.appendChild(E('path',{d:`M${cx0+s*9},${baseY} C${cx0+s*48},${baseY+16} ${ex-s*28},${ey-18} ${ex},${ey}`,stroke:'#5a4020','stroke-width':2.8-Math.abs(s)*1.2}));});
  art.appendChild(gG);

  // Trunk
  const tw=30;
  art.appendChild(E('path',{d:`M${crownX-7},${crownY} C${crownX-14},${crownY+76} ${cx0-tw*.72},${baseY-58} ${cx0-tw},${baseY} L${cx0+tw},${baseY} C${cx0+tw*.72},${baseY-58} ${crownX+14},${crownY+76} ${crownX+7},${crownY} Z`,fill:'#7c5c2c',stroke:'#4a3418','stroke-width':1}));
  art.appendChild(E('path',{d:`M${crownX+2},${crownY+8} C${crownX+10},${crownY+84} ${cx0+tw*.5},${baseY-52} ${cx0+tw},${baseY} L${cx0+tw*.35},${baseY} C${cx0+tw*.1},${baseY-60} ${crownX},${crownY+78} ${crownX},${crownY+10} Z`,fill:'#5a4020',opacity:.34,stroke:'none'}));
  const bk=E('g',{stroke:'#4a3418','stroke-width':.46,fill:'none',opacity:.3});
  for(let t=1;t<10;t++){const yy=crownY+10+t*((baseY-crownY-12)/10),ww=tw*(t/10)*.85+5;bk.appendChild(E('path',{d:`M${cx0-ww*.7},${yy} q${ww*.7},5 ${ww*1.4},0`}));}
  art.appendChild(bk);

  // Crown foliage
  const cF=E('g',{opacity:.7});
  leafCluster(cF,crownX,crownY-7,90*D2R,6,14,.9);
  leafCluster(cF,crownX-22,crownY+15,112*D2R,3,10,.7);
  leafCluster(cF,crownX+20,crownY+15,68*D2R,3,10,.7);
  art.appendChild(cF);

  // Build the entire subtree starting from ROOT
  buildSubtree(ROOT,art);

  // Title
  const ty=TY(-_OY+PAD*.45);
  const tg=E('g');
  tg.appendChild(E('text',{x:TX(0),y:ty+38,'text-anchor':'middle',style:'font-family:"Cinzel Decorative",serif;font-weight:700;font-size:30px;fill:#2a1d0e;letter-spacing:.06em;'},'Arbor Genealogica'));
  tg.appendChild(E('text',{x:TX(0),y:ty+62,'text-anchor':'middle',style:'font-family:"Cinzel",serif;font-size:13px;fill:#6a4a20;letter-spacing:.2em;'},'· DELLA  FAMIGLIA  GIUSTINIANI ·'));
  tg.appendChild(E('text',{x:TX(0),y:ty+80,'text-anchor':'middle',style:'font-family:"IM Fell English",serif;font-style:italic;font-size:12px;fill:#7a5a2c;'},'dai Giustiniani di Venezia — aggiornamento MMXXII'));
  tg.appendChild(E('text',{x:TX(0),y:ty+93,'text-anchor':'middle',style:'font-family:serif;font-size:14px;fill:#9a7634;'},'❦'));
  art.appendChild(tg);

  // Capostipiti banner
  const by2=baseY+68,bw=320;
  const ban=E('g');
  ban.appendChild(E('path',{d:`M${cx0-bw/2-16},${by2} l16,-13 ${bw},0 16,13 -16,13 ${-bw},0 Z`,fill:'#2a1d0e',stroke:'#9a7634','stroke-width':1.4}));
  ban.appendChild(E('text',{x:cx0,y:by2,'text-anchor':'middle',style:'font-family:"Cinzel",serif;font-size:12.5px;letter-spacing:.12em;fill:#e9dcbb;'},'GIROLAMO GIUSTINIANI'));
  ban.appendChild(E('text',{x:cx0,y:by2+14,'text-anchor':'middle',style:'font-family:"IM Fell English",serif;font-style:italic;font-size:11px;fill:#caa856;'},'⚭ Giulia Pandolfini · 1899–2000'));
  art.appendChild(ban);

  // Restore panel sliders
  document.querySelectorAll('input[data-id]').forEach(sl=>{
    const g=subGrps[sl.dataset.id];if(g)g.style.opacity=sl.value/100;
    const [re,rh]=rootEdgePaths[sl.dataset.id]||[];
    if(re)re.style.opacity=sl.value/100;if(rh)rh.style.opacity=sl.value/100;
  });
}

// ── BRANCH PANEL ───────────────────────────────────────────────────────────
function buildPanel(){
  const pb=document.getElementById('pb');pb.innerHTML='';
  ROOT.children.forEach(c=>{
    const col=BC[c.id]||'#8a6030';
    const row=document.createElement('div');row.className='br';
    row.innerHTML=`<div class="dot" style="background:${col}"></div><span class="bname">${c.id}. ${c.name}</span><input type="range" min="5" max="100" value="100" data-id="${c.id}">`;
    pb.appendChild(row);
    row.querySelector('.bname').addEventListener('click',()=>isolate(c.id));
    row.querySelector('input').addEventListener('input',function(){
      const g=subGrps[this.dataset.id];if(g)g.style.opacity=this.value/100;
      const [re,rh]=rootEdgePaths[this.dataset.id]||[];
      if(re)re.style.opacity=this.value/100;if(rh)rh.style.opacity=this.value/100;
    });
  });
  const acts=document.createElement('div');acts.className='pacts';
  acts.innerHTML=`<button class="pbtn" onclick="resetOp()">Reset</button><button class="pbtn" onclick="isolate(null)">Tutti</button>`;
  pb.appendChild(acts);
}
function isolate(id){
  ROOT.children.forEach(c=>{
    const op=(!id||c.id===id)?1:.08;
    const g=subGrps[c.id];if(g)g.style.opacity=op;
    const [re,rh]=rootEdgePaths[c.id]||[];
    if(re)re.style.opacity=op;if(rh)rh.style.opacity=op;
    const sl=document.querySelector(`input[data-id="${c.id}"]`);if(sl)sl.value=op*100;
  });
}
function resetOp(){
  ROOT.children.forEach(c=>{
    const g=subGrps[c.id];if(g)g.style.opacity=1;
    const [re,rh]=rootEdgePaths[c.id]||[];
    if(re)re.style.opacity=1;if(rh)rh.style.opacity=1;
    const sl=document.querySelector(`input[data-id="${c.id}"]`);if(sl)sl.value=100;
  });
}

// ── ADD CHILD ──────────────────────────────────────────────────────────────
let addTarget=null;
function showAddForm(node){
  addTarget=node;
  document.getElementById('add-for').textContent=`Figlio di: ${node.name}${node.sub?' '+node.sub:''} (${node.year||'?'})`;
  document.getElementById('an').value='';document.getElementById('ay').value='';
  document.getElementById('aerr').style.display='none';
  document.getElementById('add-panel').style.display='block';
  setTimeout(()=>document.getElementById('an').focus(),50);
}
function cancelAdd(){document.getElementById('add-panel').style.display='none';addTarget=null;}
function confirmAdd(){
  const name=document.getElementById('an').value.trim();
  const year=document.getElementById('ay').value.trim();
  if(!name){document.getElementById('aerr').style.display='block';return;}
  if(!addTarget.children)addTarget.children=[];
  addTarget.children.push({id:addTarget.id+'-x'+Date.now(),name,year,_added:true});
  saveAdditions();cancelAdd();runLayout();build();buildPanel();
}
document.getElementById('an').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('ay').focus();});
document.getElementById('ay').addEventListener('keydown',e=>{if(e.key==='Enter')confirmAdd();});

// ── NAMES TOGGLE ───────────────────────────────────────────────────────────
function toggleNames(){showNames=!showNames;document.getElementById('bn').classList.toggle('on',showNames);build();}

// ── PAN / ZOOM + NODE DRAG ─────────────────────────────────────────────────
const stage=document.getElementById('stage');
let sc=1,px=0,py=0,panning=false,lx=0,ly=0,rafId=null;
function applyVP(){art.style.transform=`translate3d(${px}px,${py}px,0) scale(${sc})`;document.getElementById('zl').textContent=`${Math.round(sc*100)}%`;rafId=null;}
const go=()=>{if(!rafId)rafId=requestAnimationFrame(applyVP);};

stage.addEventListener('mousedown',e=>{
  if(e.button!==0||nodeDrag)return;
  if(e.target.closest('#add-panel')||e.target.closest('#panel')||e.target.closest('input'))return;
  panning=true;lx=e.clientX;ly=e.clientY;e.preventDefault();
});
window.addEventListener('mousemove',e=>{
  if(nodeDrag){
    const wdx=(e.clientX-nodeDrag.startX)/sc;
    const wdy=(e.clientY-nodeDrag.startY)/sc;
    const dx=nodeDrag.origDx+wdx,dy=nodeDrag.origDy+wdy;
    nodeOffsets[nodeDrag.id]={dx,dy};
    const sg=subGrps[nodeDrag.id];
    if(sg)sg.setAttribute('transform',`translate(${dx},${dy})`);
    // Update incoming edge
    reEdge(nodeDrag.id);
    // Update ROOT→gen1 edge if applicable
    if(rootEdgePaths[nodeDrag.id]){
      const child=findNode(ROOT,nodeDrag.id);
      const x1=TX(0),y1=TY(0);
      const x2=TX(child.x)+dx,y2=TY(child.y)+dy;
      const b=edgeBends[nodeDrag.id]||0;
      const d=bezierD(x1,y1,x2,y2,b);
      rootEdgePaths[nodeDrag.id][0].setAttribute('d',d);
      rootEdgePaths[nodeDrag.id][1].setAttribute('d',d);
    }
    // Update outgoing edges to children
    child_edges:if(true){
      const node=findNode(ROOT,nodeDrag.id);
      node?.children?.forEach(c=>{
        if(inEdgePaths[c.id]){
          const x1=TX(node.x),y1=TY(node.y);
          const cOff=nodeOffsets[c.id]||{dx:0,dy:0};
          const x2=TX(c.x)+cOff.dx,y2=TY(c.y)+cOff.dy;
          const d=bezierD(x1,y1,x2,y2,edgeBends[c.id]||0);
          inEdgePaths[c.id][0].setAttribute('d',d);
          inEdgePaths[c.id][1].setAttribute('d',d);
        }
      });
    }
    return;
  }
  if(!panning)return;
  px+=e.clientX-lx;py+=e.clientY-ly;lx=e.clientX;ly=e.clientY;go();
});
window.addEventListener('mouseup',()=>{nodeDrag=null;panning=false;});
window.addEventListener('dblclick',e=>{
  // Double-click on a node resets its offset
  if(nodeDrag)return;
  // Find node at click position via SVG element
  const el=e.target.closest('g[data-reset]');
  // Note: using a different approach — double-click on stage resets all offsets
});

stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const d=e.deltaY<0?1.1:.909;
  const r=stage.getBoundingClientRect();
  px=(e.clientX-r.left)-(e.clientX-r.left-px)*d;
  py=(e.clientY-r.top)-(e.clientY-r.top-py)*d;
  sc=Math.max(.05,Math.min(6,sc*d));go();
},{passive:false});
let td=null;
stage.addEventListener('touchstart',e=>{
  if(e.touches.length===1){panning=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;td=Math.hypot(dx,dy);}
},{passive:true});
stage.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&panning){px+=e.touches[0].clientX-lx;py+=e.touches[0].clientY-ly;lx=e.touches[0].clientX;ly=e.touches[0].clientY;go();}
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,dd=Math.hypot(dx,dy);if(td){sc=Math.max(.05,Math.min(6,sc*(dd/td)));go();}td=dd;}
},{passive:false});
stage.addEventListener('touchend',()=>{panning=false;nodeDrag=null;td=null;});
function zIn(){sc=Math.min(6,sc*1.2);go();}
function zOut(){sc=Math.max(.05,sc*.833);go();}
function fit(){const vw=stage.clientWidth,vh=stage.clientHeight-44;sc=Math.min(vw/_W,vh/_H)*.9;px=(stage.clientWidth-_W*sc)/2;py=(stage.clientHeight-_H*sc)/2;go();}
